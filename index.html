<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiDEX — Sovereign Pi Exchange & PiRC Explorer</title>
    <meta name="description" content="Professional Pi Network exchange terminal: live candlestick charts, order book, AMM routing, 7-layer PiRC-207 markets, ZK settlement and network explorer." />
    <link rel="canonical" href="https://project-unity-sphere.lovable.app/" />
    <meta property="og:title" content="PiDEX — Sovereign Pi Exchange & PiRC Explorer" />
    <meta property="og:description" content="Live candlestick markets, order book depth, AMM routing and ZK settlement across the PiRC 7-layer token system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Never leave a blank screen: if startup fails, show a readable recovery card.
      (function () {
        function show(msg) {
          var r = document.getElementById("root");
          if (!r || r.childElementCount) return;
          r.innerHTML =
            '<div style="font-family:system-ui;max-width:420px;margin:15vh auto;padding:24px;border:1px solid #333;border-radius:12px;background:#111;color:#eee;text-align:center">' +
            '<div style="font-size:28px;color:#e0b23c">&pi;</div><h2 style="margin:8px 0">PiDEX could not start</h2>' +
            '<p style="color:#aaa;font-size:14px">' + String(msg).replace(/</g, "&lt;") + "</p>" +
            '<button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;border-radius:8px;border:0;background:#e0b23c;color:#000;font-weight:600">Reload</button></div>';
        }
        window.addEventListener("error", function (e) { show(e.message || "Unexpected error"); });
        window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || "Unexpected error"); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
