# Netlify is a frontend preview/QA target for this repository.
# The production FastAPI API is deployed with the Vercel project (vercel.json).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_PIRC_PORTAL_FEED_URL = "https://naeuosudklqsgeghafkw.supabase.co/functions/v1/pirc-portal-feed"
  VITE_PIRC_PORTAL_FEED_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hZXVvc3Vka2xxc2dlZ2hhZmt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NTgxMjgsImV4cCI6MjExMDIzNDEyOH0.tGQ3GglDoG3vao0MMS7DltEoweKWLtPK93hxq8qfOig"

# Netlify Functions serve the live read-only ecosystem API.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/ecosystem-feed"
  to = "/.netlify/functions/ecosystem-feed"
  status = 200
  force = true

# SPA routing: let React Router handle client-side paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline browser security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
