# Netlify is a frontend preview/QA target for this repository.
# The production FastAPI API is deployed with the Vercel project (vercel.json).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA routing: let React Router handle client-side paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline browser security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
