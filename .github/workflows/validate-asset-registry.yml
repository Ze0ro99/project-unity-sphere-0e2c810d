name: Validate asset registry and economic policy

on:
  pull_request:
    branches: [main]
    paths:
      - "schemas/asset-contract-registry.schema.json"
      - "scripts/validate_asset_contract_registry.py"
      - "tests/test_asset_contract_registry.py"
      - ".github/workflows/validate-asset-registry.yml"
  push:
    branches: [main]
    paths:
      - "schemas/asset-contract-registry.schema.json"
      - "scripts/validate_asset_contract_registry.py"
      - "tests/test_asset_contract_registry.py"
      - ".github/workflows/validate-asset-registry.yml"

permissions:
  contents: read

concurrency:
  group: asset-registry-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate registry schema and invariants
        run: |
          python scripts/validate_asset_contract_registry.py
          python -m unittest tests.test_asset_contract_registry -v
