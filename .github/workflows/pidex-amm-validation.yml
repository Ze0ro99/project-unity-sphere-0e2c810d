name: PiDEX AMM Contract Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/pidex_amm/**"
      - ".github/workflows/pidex-amm-validation.yml"
  push:
    branches: [main]
    paths:
      - "contracts/pidex_amm/**"
      - ".github/workflows/pidex-amm-validation.yml"

permissions:
  contents: write

concurrency:
  group: pidex-amm-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: PiDEX AMM unit tests and Wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.1
        with:
          workspaces: contracts/pidex_amm
      - name: Regenerate and commit lockfile including Soroban testutils
        run: |
          cargo generate-lockfile --manifest-path contracts/pidex_amm/Cargo.toml
          if ! git diff --quiet -- contracts/pidex_amm/Cargo.lock; then
            if [ -z "${GITHUB_HEAD_REF:-}" ]; then
              echo "Lockfile drift on main; update it in a reviewed PR."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/pidex_amm/Cargo.lock
            git commit -m "chore(pidex): regenerate Soroban testutils lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Check formatting
        run: cargo fmt --manifest-path contracts/pidex_amm/Cargo.toml -- --check
      - name: Run contract unit tests on native target
        run: cargo test --locked --target x86_64-unknown-linux-gnu --manifest-path contracts/pidex_amm/Cargo.toml
      - name: Build Testnet Wasm artifact
        run: cargo build --locked --manifest-path contracts/pidex_amm/Cargo.toml --target wasm32-unknown-unknown --release

# Build and test only. No signing, deployment, minting, transfer or network write.
