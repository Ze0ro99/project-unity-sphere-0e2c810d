    name: Block legacy workflow pending governed Pi Testnet deployment
    runs-on: ubuntu-latest
    steps:
      - name: Explain why this workflow is blocked
        shell: bash
        run: |
          echo "::error::This legacy workflow is disabled: deploys to Stellar public Testnet/Friendbot rather than the canonical Pi Testnet. Use the reviewed Pi Testnet read-only preflight. A future write-enabled workflow must use an explicit contract/asset allowlist, verified Pi Testnet identity, isolated Testnet signer, manual environment approval, artifact/code-hash pinning, and post-deployment state readback."
