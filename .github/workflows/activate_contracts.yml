name: Pi Testnet Read-only Network Identity Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-testnet-readonly-probe
  cancel-in-progress: true

jobs:
  verify-network-identity:
    name: Verify Pi Testnet identity (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PI_HORIZON_URL: https://api.testnet.minepi.com
      PI_SOROBAN_RPC_URL: https://rpc.testnet.minepi.com
      PI_EXPECTED_PASSPHRASE: Pi Testnet
      PI_EXPECTED_PROTOCOL: "28"
    steps:
      - name: Verify Pi Horizon and Soroban RPC identity
        shell: bash
        run: |
          set -euo pipefail

          rpc() {
            local method="$1"
            curl --fail --silent --show-error --retry 2 --retry-delay 2 \
              --connect-timeout 10 --max-time 20 \
              -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":{}}" \
              "$PI_SOROBAN_RPC_URL"
          }

          horizon="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 \
            --connect-timeout 10 --max-time 20 "$PI_HORIZON_URL/")"
          network="$(rpc getNetwork)"
          health="$(rpc getHealth)"
          latest="$(rpc getLatestLedger)"

          horizon_passphrase="$(jq -r '.network_passphrase // empty' <<<"$horizon")"
          rpc_passphrase="$(jq -r '.result.passphrase // .result.networkPassphrase // empty' <<<"$network")"
          rpc_protocol="$(jq -r '.result.protocolVersion // empty' <<<"$network")"
          horizon_protocol="$(jq -r '.core_supported_protocol_version // empty' <<<"$horizon")"
          health_status="$(jq -r '.result.status // empty' <<<"$health" | tr '[:upper:]' '[:lower:]')"
          latest_ledger="$(jq -r '.result.sequence // .result.ledger // empty' <<<"$latest")"

          test "$horizon_passphrase" = "$PI_EXPECTED_PASSPHRASE"
          test "$rpc_passphrase" = "$PI_EXPECTED_PASSPHRASE"
          test "$rpc_protocol" = "$PI_EXPECTED_PROTOCOL"
          test "$health_status" = "healthy" -o "$health_status" = "ok"
          test "$latest_ledger" -gt 0
          test "$horizon_protocol" -ge "$PI_EXPECTED_PROTOCOL"

          {
            echo "## Pi Testnet read-only identity probe"
            echo ""
            echo "- Network: Pi Testnet (Testnet1 project alias)"
            echo "- Network passphrase: verified"
            echo "- Soroban protocol: $rpc_protocol"
            echo "- Horizon supported protocol: $horizon_protocol"
            echo "- RPC health: $health_status"
            echo "- Latest ledger: $latest_ledger"
            echo ""
            echo "**Scope:** read-only connectivity and network-identity evidence only."
            echo "**Not verified:** contract deployment, code hashes, initialized state, wallet balances, swaps, settlement, liquidity, or asset activation."
            echo "**Writes/signing:** none."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Explicitly prohibit simulated activation claims
        run: |
          echo "This workflow does not activate contracts and does not submit transactions."
          echo "Contract verification requires separate per-contract readback evidence."
