name: "PiRC Auto-Upgrade (Build-Only / Deprecated Writer Disabled)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pirc-auto-upgrade-build-only
  cancel-in-progress: true

jobs:
  deprecation-notice:
    name: Explain the reviewed upgrade path
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Disable missing-script and automatic write-back path
        shell: bash
        run: |
          set -euo pipefail
          echo "The legacy pirc_final_update.py entry point is not present."
          echo "Automatic generation, git commit, and git push are intentionally disabled."
          echo "Use the dedicated frontend-build, asset-registry-api, and reviewed PR workflows."
