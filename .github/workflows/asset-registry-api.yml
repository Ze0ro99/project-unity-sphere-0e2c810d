name: Asset registry API tests

on:
  pull_request:
    paths:
      - 'api/**'
      - 'assets/registry/**'
      - 'assets/logos/**'
      - 'tests/unit/test_asset_registry.py'
      - '.github/workflows/asset-registry-api.yml'
  push:
    branches:
      - integration/sovereign-hybrid-ecosystem

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run registry API tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/unit/test_asset_registry.py
