name: RWA Extension CI (Safe & Clean)

on:
  push:
    paths:
      - 'spec/**'
      - 'examples/**'
      - '.github/workflows/rust.yml'
  pull_request:

jobs:
  validate:
    name: Validate RWA Spec & Demo
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Validate JSON Schema (fixed path + better error message)
      - name: Validate RWA specification JSON
        run: |
          SCHEMA="spec/rwa_auth_schema_v0.3.json"
          if [ ! -f "$SCHEMA" ]; then
            echo "❌ ERROR: Schema file not found at $SCHEMA"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
          python -m json.tool "$SCHEMA" > /dev/null
          echo "RWA v0.3 specification JSON is valid"

      # 4. Run RWA verification demo
      - name: Run Verification Demo
        run: |
          python examples/verification_demo_v0.3.py --product-id CI-TEST-PRODUCT --method NFC

      # 5. Success message
      - name: Success Message
        run: echo "RWA v0.3 metadata-only demo passed; no authenticity claim is made"
