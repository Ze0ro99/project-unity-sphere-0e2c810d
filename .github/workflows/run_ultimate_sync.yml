name: "PiRC Ultimate Sync (Read-Only / Legacy Injector Disabled)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecation-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Explain why legacy source injection is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo "The legacy synchronizer injects unverified token identifiers into Solidity and Rust sources."
          echo "It can modify hundreds of contracts and push directly to main; this path is disabled."
          echo "Use versioned interfaces, contract-specific tests, and reviewed pull requests instead."
