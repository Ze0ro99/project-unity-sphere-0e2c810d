name: Unity Sphere frontend build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/pigold-*.test.mjs'
      - 'tests/netlify-ecosystem-feed.test.mjs'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - '.github/workflows/frontend-build.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - '.github/workflows/frontend-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install locked dependencies
        id: locked-install
        run: npm ci --no-audit --no-fund
        continue-on-error: true

      - name: Reconcile stale npm lockfile for validation only
        if: steps.locked-install.outcome == 'failure'
        run: |
          echo "::warning::package-lock.json is out of sync with package.json; using npm install for this ephemeral CI workspace. Commit a regenerated lockfile before production release."
          npm install --no-audit --no-fund
      - name: Run PiGold economic model tests
        run: npm run test:pigold
      - name: Audit locale dictionary key coverage
        run: npm run audit:i18n
      - name: Build frontend
        run: npm run build
