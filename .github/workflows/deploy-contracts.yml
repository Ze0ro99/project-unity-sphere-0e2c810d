name: DISABLED - legacy unrestricted contract deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block unsafe legacy deployment
        run: |
          echo "::error::This legacy workflow is disabled. It checked out an unrelated branch, interpolated a deployer secret into shell code, attempted to deploy every discovered Cargo package, and did not verify the target network. Use a reviewed, contract-specific Pi Testnet deployment workflow with protected environment approval."
          exit 1
