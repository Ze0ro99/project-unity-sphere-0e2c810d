name: Unity Sphere Rust Validation (Fail-Closed)

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/soroban/**"
      - ".github/workflows/ci-full-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "contracts/soroban/**"
      - ".github/workflows/ci-full-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-soroban-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Soroban workspace (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --manifest-path contracts/soroban/Cargo.toml -- --check
      - name: Check locked dependencies
        run: cargo check --manifest-path contracts/soroban/Cargo.toml --locked
      - name: Run tests
        run: cargo test --manifest-path contracts/soroban/Cargo.toml --locked
      - name: Build release WASM
        run: cargo build --manifest-path contracts/soroban/Cargo.toml --locked --release --target wasm32-unknown-unknown

# Validation only. No transaction signing or contract deployment.