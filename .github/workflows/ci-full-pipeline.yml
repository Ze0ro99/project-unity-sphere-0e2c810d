name: Unity Sphere Rust Validation (Fail-Closed)

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "contracts/**"
      - ".github/workflows/ci-full-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "contracts/**"
      - ".github/workflows/ci-full-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-rust-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, compile and test (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check locked dependency graph
        run: cargo check --locked
      - name: Run tests
        run: cargo test --locked
      - name: Build release WASM
        run: cargo build --locked --release --target wasm32-unknown-unknown

# This workflow is validation-only. Contract deployment and transaction signing
# require a separate, explicitly approved environment workflow.
