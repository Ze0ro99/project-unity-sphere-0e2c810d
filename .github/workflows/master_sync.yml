name: "PiRC Master Sync (Read-Only / Legacy Writer Disabled)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pirc-master-sync-read-only
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify expected project files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f schemas/pirc207_layers.json
          test -d src
          echo "Read-only preflight passed."
          echo "Legacy file rewriting and automatic pushes to main are disabled."
