name: DISABLED — legacy Universal RWA orchestrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    name: Block legacy non-governed deployment path
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain the safety gate
        shell: bash
        run: |
          echo "::error::This legacy workflow is disabled."
          echo "It performed branch harvesting, asset issuance, liquidity-pool deposits,"
          echo "secret-based signing, and direct pushes to main without a governed"
          echo "Pi Testnet deployment manifest, allowlist, or post-deployment readback."
          echo "Use the reviewed, read-only Pi Testnet preflight and a separately approved"
          echo "deployment workflow after contract IDs, signer policy, and acceptance tests"
          echo "are verified."
          exit 1
