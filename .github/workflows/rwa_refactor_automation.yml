name: RWA Refactor Automation (Retired - Safe Stub)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "This legacy automation is intentionally disabled."
          echo "It previously contained automatic repository writes, merges, deployments, or simulated verification."
          echo "Use reviewed pull requests and the read-only validation workflows instead."
          echo "No repository or network mutation is performed by this workflow."
