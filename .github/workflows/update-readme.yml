name: PiRC proposal table generation validation

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate_pirc_table.py"
      - "scripts/update_readme_table.py"
      - "README.md"
      - ".github/workflows/update-readme.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate_pirc_table.py"
      - "scripts/update_readme_table.py"
      - "README.md"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pirc-readme-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate proposal table in the ephemeral workspace
        run: |
          python scripts/generate_pirc_table.py > table.md
          test -s table.md
      - name: Validate generated table structure
        run: |
          python - <<'PY'
          from pathlib import Path
          table = Path("table.md").read_text(encoding="utf-8")
          lines = [line for line in table.splitlines() if line.startswith("|")]
          if len(lines) < 3 or not lines[0].startswith("| Proposal |"):
              raise SystemExit("Generated PiRC proposal table is empty or malformed.")
          print(f"Validated {len(lines) - 2} proposal rows.")
          PY
