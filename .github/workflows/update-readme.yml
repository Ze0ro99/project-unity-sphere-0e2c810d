name: PiRC README table consistency check

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate_pirc_table.py"
      - "scripts/update_readme_table.py"
      - "README.md"
      - ".github/workflows/update-readme.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate_pirc_table.py"
      - "scripts/update_readme_table.py"
      - "README.md"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pirc-readme-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify README table markers
        run: |
          grep -q '<!-- TABLE_START -->' README.md
          grep -q '<!-- TABLE_END -->' README.md
      - name: Regenerate proposal table in the ephemeral workspace
        run: |
          python scripts/generate_pirc_table.py > table.md
          python scripts/update_readme_table.py
      - name: Fail if README needs a reviewed update
        run: |
          if ! git diff --quiet -- README.md; then
            echo "::error::README proposal table is stale. Update it in a reviewed pull request; this workflow never commits or pushes."
            git diff --stat -- README.md
            exit 1
          fi
          echo "README proposal table is current."
