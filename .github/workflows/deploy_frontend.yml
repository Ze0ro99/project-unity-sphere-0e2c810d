name: "Unity Sphere — Build and Publish Static Site Only"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".github/workflows/deploy_frontend.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".github/workflows/deploy_frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-sphere-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify publish artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source without persistent Git credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic denomination tests
        run: npm run test:denomination

      - name: Build GitHub Pages application
        run: npm run build -- --base=/project-unity-sphere-0e2c810d/

      - name: Enforce publish-artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          if find dist -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .; then
            echo "::error::Sensitive environment or key material found in dist; refusing to publish."
            exit 1
          fi
          touch dist/.nojekyll

      - name: Upload verified static site
        uses: actions/upload-artifact@v4
        with:
          name: unity-sphere-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish verified dist to gh-pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified static site
        uses: actions/download-artifact@v4
        with:
          name: unity-sphere-dist
          path: dist/

      - name: Publish built site to gh-pages only
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: publish verified Unity Sphere dist"
