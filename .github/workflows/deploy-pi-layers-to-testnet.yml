name: DISABLED - unverified seven-layer deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block unverified deployment
        run: |
          echo "::error::This legacy workflow is disabled. It uses a generic Stellar testnet alias, mutates Cargo.toml during deployment, suppresses initialization failures, and prints a success claim without independent readback. A Pi Testnet deployment must use the explicit Pi RPC, verify network identity, pin artifacts and verify each deployed contract."
          exit 1
