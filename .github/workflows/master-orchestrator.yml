name: "PiRC Master Orchestrator (Read-Only)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-orchestrator-read-only
  cancel-in-progress: true

jobs:
  repository-preflight:
    name: Read-only repository preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -d .github/workflows
          test -d contracts
          test -d docs
          echo "Read-only preflight passed."
          echo "No branch harvesting, file deletion, secret access, signing, payment, liquidity operation, deployment, or push is performed."
          echo "Use reviewed pull requests and dedicated testnet deployment workflows for separately authorized operations."
