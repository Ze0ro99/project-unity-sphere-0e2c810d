name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - integration/sovereign-hybrid-ecosystem
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 256
          persist-credentials: false
      # Fetch the base history deep enough for Gitleaks' first-parent comparison.
      # This avoids a full clone while ensuring the base parent exists locally.
      - name: Fetch the comparison base for Gitleaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --deepen=256 origin "$BASE_SHA"
      - name: Fetch the previous push commit for Gitleaks
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: git fetch --no-tags --depth=2 origin "$BEFORE_SHA"
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
