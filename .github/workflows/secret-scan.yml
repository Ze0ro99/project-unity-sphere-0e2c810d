name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - integration/sovereign-hybrid-ecosystem
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history for Gitleaks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Gitleaks computes a first-parent commit range. A shallow checkout can
          # omit the parent of the oldest PR commit, causing an invalid range and
          # a zero-byte partial scan that fails without checking any secrets.
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
