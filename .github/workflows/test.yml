name: PiRC Focused Validation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Test exact Pi denomination
        run: npm run test:denomination

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Probe Pi Testnet and Stellar Testnet (read-only)
        env:
          PI_TESTNET_HTTP_TIMEOUT_SECONDS: "15"
          NETWORK_SMOKE_TIMEOUT_SECONDS: "15"
        run: python scripts/test_network_endpoints.py

      - name: Compile maintained simulator
        run: python -m py_compile simulator/stochastic_abm_simulator.py

      - name: Test asset registry API
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/unit/test_asset_registry.py
