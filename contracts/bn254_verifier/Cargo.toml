[package]
name = "bn254_verifier"
version = "1.0.0"
edition = "2021"
license = "PiOS"
description = "PiRC-800 attestor-backed commitment verifier; BN254 feature fails closed until a real host binding exists"

[lib]
crate-type = ["cdylib"]

[features]
# Off by default: attestor-backed commitment mode.
# The bn254 feature is intentionally fail-closed until a real Soroban host
# pairing binding and independent protocol tests are implemented.
default = []
bn254 = []

[dependencies]
soroban-sdk = "22.0.11"

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
