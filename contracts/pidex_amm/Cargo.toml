[package]
name = "pidex_amm"
version = "1.0.0"
edition = "2021"
license = "PiOS"
description = "PiDEX AMM — PiRC-101/207/215/227/251/800 compliant constant-product market maker"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.11"
# Pin the fixed ethnum release required by current Rust toolchains.
ethnum = "=1.5.3"

[dev-dependencies]
# Pin the host used by Soroban 22.0.11 testutils. 22.1.x pulls ed25519-dalek 3 / rand_core 0.10, which is incompatible with the SDK 22.0.11 test RNG.
soroban-env-host = "=22.0.11"
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true

# Keep this contract independently buildable; the parent contracts/Cargo.toml
# is a legacy package manifest with a missing library source.
[workspace]
resolver = "2"
